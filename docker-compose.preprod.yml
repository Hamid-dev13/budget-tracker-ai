services:
  mcp:
    build: ./mcp
    volumes:
      - ./data:/app/data
    environment:
      - BUDGET_PATH=/app/data/budget.test.json

  dashboard:
    build: ./dashboard
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    environment:
      - BUDGET_PATH=/app/data/budget.test.json
    depends_on:
      - mcp
