# Preprod — port 3001, données de test.
# `name` distinct : sans lui, Compose réutilise le nom du répertoire et
# remplacerait les conteneurs de prod au lieu de tourner à côté.
name: budget-tracker-preprod

services:
  app:
    build: ./dashboard
    ports:
      # Loopback par défaut. Sur le lab, BIND_ADDR=<ip tailscale> dans .env.
      # Ne jamais publier sur 0.0.0.0 : l'API accepte des écritures sans authentification.
      - "${BIND_ADDR:-127.0.0.1}:3001:3000"
    volumes:
      - ./data:/app/data
    # L'API écrit dans le bind mount : le conteneur doit porter l'uid du propriétaire
    # de ./data sur l'hôte, sinon toute écriture échoue en EACCES.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      - BUDGET_PATH=/app/data/budget.test.json
