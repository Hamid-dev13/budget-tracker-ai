# Recette API — port 3002, budget JETABLE.
# La recette écrit et supprime : ce Compose garantit que le serveur visé
# pointe bien sur le fichier que le script pilote.
name: budget-tracker-recette

services:
  app:
    build: ./dashboard
    ports:
      # Loopback par défaut. Sur le lab, BIND_ADDR=<ip tailscale> dans .env.
      # Ne jamais publier sur 0.0.0.0 : l'API accepte des écritures sans authentification.
      - "${BIND_ADDR:-127.0.0.1}:3002:3000"
    volumes:
      - ./data:/app/data
    # L'API écrit dans le bind mount : le conteneur doit porter l'uid du propriétaire
    # de ./data sur l'hôte, sinon toute écriture échoue en EACCES.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      - BUDGET_PATH=/app/data/budget.recette.json
